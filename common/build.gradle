plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

sourceSets.main.resources.srcDir file('src/main/generated')

dependencies {
    compileOnly 'net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7'

    modImplementation("net.blay09.mods:balm-common:${project.balm_version}+${project.minecraft_version}") {
        changing = project.balm_version.contains('SNAPSHOT')
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.files
}